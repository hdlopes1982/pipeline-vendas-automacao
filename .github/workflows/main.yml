name: Weekly Sales Ingestion (GitHub Internal)

on:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Permissão vital para o GitHub conseguir gravar o ficheiro de volta
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl xlsxwriter

      - name: Execute Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python script_vendas.py

      # ESTE PASSO FAZ O UPLOAD DO EXCEL ATUALIZADO PARA O TEU GITHUB
      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add Base_Vendas.xlsx
          git commit -m "Auto-update sales data [skip ci]" || echo "No changes to commit"
          git push
